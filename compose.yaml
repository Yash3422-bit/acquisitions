services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.node24

    image: acquisitions-api:node24-hardened
    container_name: acquisitions-api-compose

    ports:
      - '3005:3000'

    env_file:
      - .env

    environment:
      NODE_ENV: production

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  acquisitions-data:
    name: acquisitions-compose-data
